  - id: jpegcam
    name: JPEGCAM
    packageName: com.jpegcam.sony
    version: "2.03"
    size: 1.6MB
    price: Free (PRO unlock $20 one-time)
    description: >-
      JPEG.CAM is a custom application that installs directly onto a Sony
      camera's internal hardware via the PlayMemories Camera Apps (PMCA)
      system, taking over the camera screen to provide a film-inspired
      shooting experience. It intercepts the camera's physical dials and
      processes in-camera JPEGs using custom .cube LUTs, and adds
      heads-up displays with physics-based focus mapping for use with
      vintage manual lenses. A built-in web server lets users upload LUTs
      and lens profiles from a phone. The free LIGHT tier includes one
      customizable slot, while the one-time $20 PRO unlock adds a
      personal recipe library.
    cameras:
      - ILCE-5000
      - ILCE-5100
      - ILCE-6000
      - ILCE-6300
