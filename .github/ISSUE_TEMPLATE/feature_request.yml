name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Some larger features (firmware updates, GPS assist upload, streaming config, WiFi management,
        SPK↔APK conversion, backup parsing) are already on the radar and prioritized by community interest — a clear,
        well-motivated request helps them move up the list.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or frustration behind the request, not just the solution.
      placeholder: "I want to ... but currently I can't because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you currently use, or other approaches you thought about.
