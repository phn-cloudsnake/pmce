name: Release

# Build downloadable desktop app installers and publish them to a GitHub Release.
#
# Triggers:
#   - Pushing a version tag like `v0.1.0` builds and publishes a release automatically.
#   - Manual "Run workflow" builds the installers and uploads them as workflow
#     artifacts (no release is published) so you can test the build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OS builds if one fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: pmce-macos
            # DMG + auto-update metadata
            pattern: |
              pmce-app/dist/electron/Packaged/*.dmg
              pmce-app/dist/electron/Packaged/*.dmg.blockmap
          - os: windows-latest
            artifact: pmce-windows
            # NSIS installer + auto-update metadata
            pattern: |
              pmce-app/dist/electron/Packaged/*.exe
              pmce-app/dist/electron/Packaged/*.exe.blockmap
          - os: ubuntu-latest
            artifact: pmce-linux
            pattern: |
              pmce-app/dist/electron/Packaged/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build USB interface library
        run: pnpm --filter pmce-usb-interface run build

      - name: Build desktop app (electron)
        # electron-builder reads config from quasar.config.ts and outputs to
        # pmce-app/dist/electron/Packaged. Passing the token lets it publish
        # release assets on tag builds; on manual runs it just packages.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter pmce-app run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    # Only publish a release for tag pushes, after all platform builds succeed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Attach every installer produced by the build matrix.
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
